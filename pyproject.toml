[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onionaccelerator"
version = "0.1.0.dev0"
description = "Discover and download files over pools of Tor SOCKS5 circuits"
readme = "README.md"
license = {file = "LICENSE"}
# One floor for the whole project. 3.11 is the oldest CPython still receiving security
# fixes, and it ships tomllib, which the crawler's listing templates are read with.
requires-python = ">=3.11"
# Floors, not pins: CI installs these exact lowest versions on the oldest Python
# (the lowest-deps job), so a floor that stops working fails a build instead of a user.
dependencies = [
    "requests>=2.28",
    "PySocks>=1.7.1",          # socks5h:// for requests; rvtree's own floor too
    "tqdm>=4.64",
    # --mode crawl and --detect. Imported lazily, so --farm and the download modes
    # still run on a host where these fail to import.
    "aiohttp>=3.9",
    "aiohttp-socks>=0.8.1",    # 0.8.0 fails every proxied crawl request
    "beautifulsoup4>=4.12",
    "lxml>=4.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
onionaccelerator = "OnionAccelerator:main"

[tool.setuptools]
# The CLI stays a top-level module so `python3 OnionAccelerator.py` keeps working from a
# checkout. rvtree is shipped from remote_viewer/, where it remains its own installable
# project (remote_viewer/pyproject.toml); it is bundled here rather than depended on
# because pip cannot depend on an unpublished project by relative path.
# tests/test_facade.py fails if a package directory is missing from this list.
py-modules = ["OnionAccelerator", "fullhelp"]
packages = [
    "crawler", "crawler.listing", "crawler.listing.strategies",
    "eventstream",
    "oacore",
    "rvtree", "rvtree.formats", "rvtree.transport",
]
package-dir = {"rvtree" = "remote_viewer/rvtree"}

[tool.setuptools.package-data]
"crawler.listing" = ["templates/*.toml"]

[tool.pytest.ini_options]
# The rvtree suite under remote_viewer/ has its own conftest.py and runs from there.
# Collecting both from the root imports two top-level modules named `conftest`.
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: hits the real internet over Tor; run with -m network",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["remote_viewer/tests/fixtures"]

[tool.ruff.lint]
# Pinned explicitly so a contributor's own ruff config cannot widen it: pyflakes plus
# the pycodestyle errors, which is what the code was written against.
select = ["E4", "E7", "E9", "F"]
# E731 (a lambda bound to a name) and E741 (a variable named `l`) are style, not errors.
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# The façade re-exports oacore/ by importing names it does not use itself.
"OnionAccelerator.py" = ["F401"]
