# Credential and key material. These are file-type and file-name patterns, nothing more:
# a name is a claim about a file, not a look inside it, and the reason says so.
# Scores run high because a leaked private key is the one finding that is useful to an
# attacker on its own.
[pack]
name = "credentials"
description = "Private keys, password vaults, dotenv and cloud credential files"

[[rule]]
id = "ssh-private-key"
score = 90
on = "name"
regex = '(?i)^(id_(rsa|dsa|ecdsa|ed25519)|identity)$'
reason = "An SSH private key by name"
positive = ["/home/u/.ssh/id_rsa", "/backup/ID_ED25519"]
negative = ["/home/u/.ssh/id_rsa.pub", "/docs/identity-policy.pdf"]

[[rule]]
id = "key-bundle"
score = 70
on = "name"
regex = '(?i)\.(pem|ppk|p12|pfx|jks|keystore)$'
reason = "A certificate or private-key bundle by extension"
positive = ["/certs/server.pfx", "/old/Putty.PPK", "/app/trust.keystore"]
negative = ["/docs/pemberton.txt", "/docs/pfx-notes.md"]

[[rule]]
id = "key-file"
score = 50
on = "name"
regex = '(?i)\.key$'
reason = "A .key file: a private key, or an Apple Keynote presentation"
positive = ["/tls/server.key"]
negative = ["/docs/keyboard.txt", "/docs/key.txt"]

[[rule]]
id = "password-vault"
score = 85
on = "name"
regex = '(?i)\.(kdbx?|1pif|opvault|psafe3|agilekeychain)$'
reason = "A password-manager database by extension"
positive = ["/backup/vault.kdbx", "/home/u/Passwords.1pif"]
negative = ["/docs/kdbx-format.md", "/docs/safe.txt"]

[[rule]]
id = "credentials-file"
score = 75
on = "name"
regex = '(?i)^(passwords?|credentials?|secrets?|logins?)[^/]*\.(txt|csv|xlsx?|docx?|json|ya?ml|ini|conf|cfg|md)$'
reason = "A document named for passwords or credentials"
positive = ["/it/passwords.xlsx", "/it/Credentials_prod.txt", "/ops/secrets.yaml"]
negative = ["/it/password_policy.pdf", "/pub/loginpage.png", "/it/mypasswords.txt"]

[[rule]]
id = "dotenv"
score = 80
on = "name"
regex = '^\.env(\.[A-Za-z0-9_-]+)?$'
reason = "A dotenv file, which usually holds application secrets"
positive = ["/app/.env", "/app/.env.production"]
negative = ["/app/environment.txt", "/app/.envrc", "/app/env"]

[[rule]]
id = "cloud-credentials"
score = 90
regex = '(?i)(^|/)\.aws/credentials$'
reason = "An AWS shared credentials file"
positive = ["/home/u/.aws/credentials"]
negative = ["/home/u/.aws/config", "/docs/aws/credentials.md"]

[[rule]]
id = "kube-config"
score = 85
regex = '(?i)(^|/)\.kube/config$'
reason = "A kubectl configuration, which can embed cluster credentials"
positive = ["/home/u/.kube/config"]
negative = ["/home/u/.kube/cache/x", "/docs/kube/config.md"]

[[rule]]
id = "credential-dotfile"
score = 80
on = "name"
regex = '^(\.netrc|\.pgpass|\.git-credentials|\.npmrc|\.pypirc|\.my\.cnf)$'
reason = "A dotfile that conventionally stores a login"
positive = ["/home/u/.netrc", "/home/u/.pgpass", "/home/u/.git-credentials"]
negative = ["/home/u/netrc", "/home/u/.netrc.bak"]

[[rule]]
id = "unix-password-database"
score = 85
regex = '(?i)(^|/)etc/(shadow|master\.passwd|gshadow)-?$'
reason = "A Unix password hash database"
positive = ["/backup/etc/shadow", "/mnt/root/etc/master.passwd"]
negative = ["/docs/shadow.txt", "/etc/shadow.sample"]

[[rule]]
id = "browser-secrets"
score = 70
on = "name"
regex = '^(Login Data|logins\.json|key[34]\.db|cookies\.sqlite)$'
reason = "A browser profile file that stores saved logins or sessions"
positive = ["/profiles/u/Login Data", "/profiles/u/logins.json", "/profiles/u/key4.db"]
negative = ["/docs/login data.txt", "/profiles/u/places.sqlite"]

[[rule]]
id = "api-token-file"
score = 70
regex = '(?i)(?<![^/_.-])(api[_-]?keys?|access[_-]?tokens?|auth[_-]?tokens?)([_.-][^/]*)?\.(txt|json|ya?ml|csv|env)$'
reason = "A file named for API keys or access tokens"
positive = ["/ops/api_keys.txt", "/ops/access-token.json", "/ops/auth_tokens_prod.yaml"]
negative = ["/ops/apikeys.pdf", "/ops/token-bucket.md", "/ops/access_tokens_policy.docx"]
